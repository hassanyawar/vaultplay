# Fly.io deployment config for the VAULTPLAY backend.
# Before first deploy, run: flyctl launch --no-deploy (in server/)
# then set secrets (see README) and run: flyctl deploy

app = 'vaultplay-api'
primary_region = 'iad'

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
